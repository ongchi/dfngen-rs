[package]
name = "dfngen-rs"
version = "0.8.0"
description = "dfngen: Discrete Fracture Networks (DFN) generator"
edition = "2021"
license = "LGPL-3.0"

[lib]
name = "dfngen"

[[bin]]
name = "dfngen"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The dfngen binary: command line, log to stdout and progress bar
cli = ["dep:clap", "dep:indicatif", "dep:tracing-subscriber"]
disable_shortening_int = []

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }
parry3d-f64 = "0.19"
# No OS random generator (getrandom): it is not used, and it does not
# compile for wasm32-unknown-unknown
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_distr = { version = "0.5", default-features = false, features = ["std", "std_math"] }
rand_mt = "5.0"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
statrs = { version = "0.19.1", default-features = false }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
