[package]
name = "dfngen-rs"
version = "0.4.0"
description = "dfngen: Discrete Fracture Networks (DFN) generator"
edition = "2021"
license = "LGPL-3.0"

[[bin]]
name = "dfngen"
path = "src/main.rs"

[features]
disable_shortening_int = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.6"
parry3d-f64 = "0.19"
rand = "0.9"
rand_distr = "0.5"
rand_mt = "5.0"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
statrs = { version = "0.19.1", default-features = false }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
