[package]
name = "dfngen-rs"
version = "0.13.0"
description = "dfngen: Discrete Fracture Networks (DFN) generator"
edition = "2021"
license = "LGPL-3.0"

[lib]
name = "dfngen"

[[bin]]
name = "dfngen"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The dfngen binary: command line, log to stdout, progress bar, Ctrl-C and the
# math functions of WebAssembly
cli = ["dep:clap", "dep:ctrlc", "dep:indicatif", "dep:libm", "dep:tracing-subscriber"]
disable_shortening_int = []

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }
i_overlay = "9.1"
indicatif = { version = "0.18.6", optional = true }
# The math functions of the binary (src/libm_symbols.rs)
libm = { version = "0.2.16", optional = true }
parry3d-f64 = "0.19"
# No OS random generator (getrandom): it is not used, and it does not
# compile for wasm32-unknown-unknown
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_distr = { version = "0.5", default-features = false, features = ["std", "std_math"] }
rand_mt = "5.0"
# Binary format of the checkpoints: exact f64, compiles for wasm32-unknown-unknown
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
spade = "2.15"
statrs = { version = "0.19.1", default-features = false }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
uninlined_format_args = "warn"
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
redundant_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
cast_possible_wrap = "warn"
