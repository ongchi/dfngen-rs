# keep_only_connected_to = [["west"], ["east"]] with [mesh]: the mesh keeps
# only its connected parts which touch a boundary surface of each group. The domain is the mesh of
# boundary_surfaces (box of 10 m, faces west at x = -5 and east at x = 5).
# Fracture 1 crosses the box from west to east. Fracture 2 intersects
# fracture 1 only at y = 6, outside the box: the cluster analysis puts them
# in one cluster, but in the mesh fracture 2 is a part of its own, on no
# boundary surface. Thus fracture 2 is not a final fracture.

seed = 12345
min_feature_size = 0.3
domain = "../boundary_surfaces/boundary_surfaces.vtu"
user_fractures = "clusters_connect_surfaces_mesh.vtp"

[generation]
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
check_user_fractures = false
write_rejected_fractures = false
rejects_per_fracture = 10

[region_boundaries]
enable = true

[mesh]
enable = true
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = false
keep_only_connected_to = [["west"], ["east"]]
