# Domain mesh with one cell of each type: tetrahedron, voxel, hexahedron, wedge
# and pyramid. Small fractures, because the mesh is only 2 thick.

seed = 12345
min_feature_size = 0.05
domain = "mesh_cell_types.vtu"

[generation]
n_poly = 100
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
write_rejected_fractures = false
rejects_per_fracture = 10

[clusters]
keep_only_largest = false
keep_isolated_fractures = false

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 0.3, max = 0.8 }
orientation = { theta = 0.0, phi = 0.0, kappa = 10.0 }

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 0.3, max = 0.8 }
orientation = { theta = 90.0, phi = 0.0, kappa = 10.0 }
