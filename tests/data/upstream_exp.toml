seed = 1
h = 0.1
angle_unit = "degree"

[domain]
size = [10.0, 10.0, 10.0]
size_increase = [0.0, 0.0, 0.0]

[generation]
stop_condition = "n_poly"
n_poly = 30
radii_list_increase = 0.1
rejects_per_fracture = 10
force_large_fractures = false
remove_fractures_less_than = 0.0
insert_user_rectangles_first = true

[fram]
disable = false
relaxed = false
triple_intersections = false

[clusters]
boundary_faces = [false, false, true, true, false, false]
ignore_boundary_faces = false
keep_only_largest = true
keep_isolated_fractures = false

[output]
print_reject_reasons = false
rejected_fractures = false

[[family]]
shape = "rectangle"
probability = 1.0
aspect_ratio = 1.0
layer = 0
region = 0
radius = { distribution = "exponential", mean = 2.5, min = 1.0, max = 10.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }
