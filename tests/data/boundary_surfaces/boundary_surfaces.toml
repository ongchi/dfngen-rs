# Feature: boundary surfaces of the domain mesh (surface cells with the
# cell data arrays boundary__<name>). The network of mesh, in the box of
# box.vtu with its 6 faces as quads: the face at x = -5 is on the boundary
# west, the face at x = 5 on the boundary east, the other faces on none.

seed = 12345
min_feature_size = 0.1
domain = "boundary_surfaces.vtu"

[generation]
n_poly = 100
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
write_rejected_fractures = false
rejects_per_fracture = 10

[region_boundaries]
enable = true

[mesh]
enable = true
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = false
keep_only_connected_to_surfaces = false

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 4.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 10.0 }

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
aperture = { distribution = "correlated", alpha = 1e-4, beta = 0.5 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 4.0 }
orientation = { theta = 90.0, phi = 0.0, kappa = 10.0 }
