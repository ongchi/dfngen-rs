seed = 2
h = 0.1

[domain]
size = [15.0, 15.0, 15.0]
size_increase = [0.5, 0.5, 0.5]

[generation]
stop_condition = "p32"
radii_list_increase = 0.1
rejects_per_fracture = 10
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
disable = false
relaxed = false
triple_intersections = false

[clusters]
boundary_faces = [true, true, false, false, false, false]
ignore_boundary_faces = false
keep_only_largest = true
keep_isolated_fractures = false

[output]
print_reject_reasons = false
rejected_fractures = false

[[family]]
number_of_points = 8
probability = 1.0
aspect_ratio = 1.0
layer = 0
region = 0
p32_target = 1.0
radius = { distribution = "truncated_power_law", alpha = 1.8, min = 1.0, max = 10.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 1.0 }
