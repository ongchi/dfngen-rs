# FRAM with a dense network of 3 families, normal to x, y and z. Each rejected
# fracture goes to fractures_rejected.vtp, and the log has each reject reason.

seed = 12345
min_feature_size = 0.1
domain = "../box.vtu"

[generation]
n_poly = 150
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
write_rejected_fractures = true
rejects_per_fracture = 10

[region_boundaries]
enable = false

[mesh]
enable = false
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = false

[[family]]
number_of_points = 8
probability = 0.4
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 20.0 }

[[family]]
number_of_points = 8
probability = 0.3
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 90.0, phi = 0.0, kappa = 20.0 }

[[family]]
number_of_points = 8
probability = 0.3
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 90.0, phi = 90.0, kappa = 20.0 }
