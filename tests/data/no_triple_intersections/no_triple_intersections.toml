# triple_intersections = false: FRAM rejects each fracture which makes a triple
# intersection. Same network input as fram_rejections.

seed = 12345
min_feature_size = 0.1
domain = "../box.vtu"

[generation]
n_poly = 150
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = false
write_rejected_fractures = false
rejects_per_fracture = 10

[clusters]
keep_only_largest = false
keep_isolated_fractures = false

[[family]]
number_of_points = 8
probability = 0.4
aspect_ratio = 1.0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 20.0 }

[[family]]
number_of_points = 8
probability = 0.3
aspect_ratio = 1.0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 90.0, phi = 0.0, kappa = 20.0 }

[[family]]
number_of_points = 8
probability = 0.3
aspect_ratio = 1.0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 3.0 }
orientation = { theta = 90.0, phi = 90.0, kappa = 20.0 }
