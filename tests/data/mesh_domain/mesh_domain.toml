seed = 12345
h = 0.1

[domain]
mesh = "mesh_domain.vtu"
truncate_fractures = false

[generation]
stop_condition = "n_poly"
n_poly = 100
radii_list_increase = 0.1
rejects_per_fracture = 10
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
disable = false
relaxed = false
triple_intersections = true

[clusters]
boundary_faces = [true, true, false, false, false, false]
ignore_boundary_faces = true
keep_only_largest = false
keep_isolated_fractures = false

[output]
print_reject_reasons = false
rejected_fractures = false

# Whole mesh
[[family]]
number_of_points = 8
probability = 0.6
aspect_ratio = 1.0
region = 0
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 8.0 }

# Only the cells with region = 2
[[family]]
number_of_points = 12
probability = 0.4
aspect_ratio = 2.0
region = 2
beta = 30.0
radius = { distribution = "constant", value = 1.5 }
orientation = { theta = 45.0, phi = 15.0, kappa = 20.0 }

# The center (17, 27, 35) is in no cell, but the fracture intersects the cells
[[user_fracture]]
number_of_points = 4
radius = 4.0
aspect_ratio = 1.0
beta = 0.0
translation = [17.0, 27.0, 35.0]
normal = [0.0, 0.0, 1.0]

# This fracture intersects no cell. It is rejected.
[[user_fracture]]
vertices = [[17.0, 27.0, 32.0], [19.0, 27.0, 32.0], [19.0, 29.0, 32.0], [17.0, 29.0, 32.0]]
