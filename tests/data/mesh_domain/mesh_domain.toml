seed = 12345
min_feature_size = 0.1
domain = "mesh_domain.vtu"
user_fractures = "mesh_domain_user_fractures.vtp"

[generation]
n_poly = 100
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
check_user_fractures = true
write_rejected_fractures = false
rejects_per_fracture = 10

[region_boundaries]
enable = false

[mesh]
enable = false
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = false
keep_only_connected_to = []

# Whole mesh
[[family]]
number_of_points = 8
probability = 0.6
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 8.0 }

# Only the cells of the region north
[[family]]
number_of_points = 12
probability = 0.4
aspect_ratio = 2.0
region = "north"
beta = 30.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "constant", value = 1.5 }
orientation = { theta = 45.0, phi = 15.0, kappa = 20.0 }

# The center (17, 27, 35) is in no cell, but the fracture intersects the cells
