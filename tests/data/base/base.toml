# Base input of the feature cases: box mesh of 10 x 10 x 10, 2 families,
# stop at n_poly = 100 fractures, FRAM on, default cluster options (isolated
# fractures are removed). The other cases change only the keys of their feature.

seed = 12345
min_feature_size = 0.1
domain = "../box.vtu"

[generation]
n_poly = 100
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
write_rejected_fractures = false
rejects_per_fracture = 10

[region_boundaries]
enable = false

[mesh]
enable = false
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = false
keep_only_connected_to = []

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 4.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 10.0 }

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 2.5, min = 1.0, max = 4.0 }
orientation = { theta = 90.0, phi = 0.0, kappa = 10.0 }
