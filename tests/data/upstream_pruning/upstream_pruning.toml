seed = 1
min_feature_size = 0.1
domain = "upstream_pruning.vtu"

[generation]
stop_condition = "p32"
radii_list_increase = 0.1
rejects_per_fracture = 10
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = false

[clusters]
keep_only_largest = true
keep_isolated_fractures = false

[output]
print_reject_reasons = false
rejected_fractures = false

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
p32_target = 0.5
radius = { distribution = "truncated_power_law", alpha = 2.1, min = 1.0, max = 10.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[[family]]
number_of_points = 8
probability = 0.5
aspect_ratio = 1.0
p32_target = 0.5
radius = { distribution = "truncated_power_law", alpha = 2.1, min = 1.0, max = 10.0 }
