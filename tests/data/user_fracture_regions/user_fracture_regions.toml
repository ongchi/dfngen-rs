# Regions of user-defined fractures (region__<name> arrays of the fracture file).
# A fracture which does not intersect a cell of its regions is rejected. The mesh
# is ../regions.vtu. keep_isolated_fractures = true keeps the fractures, which do
# not intersect, in the output.

seed = 12345
min_feature_size = 0.1
domain = "../regions.vtu"
user_fractures = "user_fracture_regions.vtp"

[generation]
force_large_fractures = false
remove_fractures_less_than = 0.0

[fram]
enable = true
relaxed = false
triple_intersections = true
check_user_fractures = true
write_rejected_fractures = false
rejects_per_fracture = 10

[region_boundaries]
enable = false

[mesh]
enable = false
max_size_factor = 10.0
slope = 0.5

[clusters]
keep_only_largest = false
keep_isolated_fractures = true
keep_only_connected_to_surfaces = false
